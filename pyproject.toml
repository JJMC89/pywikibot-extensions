[build-system]
requires = ["poetry_core>=1.0.8"]
build-backend = "poetry.core.masonry.api"


[tool.black]
target-version = ["py39"]
line-length = 79  # default: 88


[tool.coverage]

[tool.coverage.run]
plugins = [
    "covdefaults",
]


[tool.isort]
atomic = true
lines_after_imports = 2
profile = "black"
py_version = 39


[tool.mypy]
python_version = 3.9
enable_error_code = [
    "ignore-without-code",
]
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "pywikibot.*"
ignore_missing_imports = true


[tool.poetry]
authors = ["JJMC89"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Wiki",
    "Topic :: Utilities",
    "Typing :: Typed",
]
description = "Extends the Pywikibot library"
keywords = ["bot", "mediawiki"]
license = "MIT"
name = "pywikibot-extensions"
readme = "README.md"
repository = "https://github.com/JJMC89/pywikibot-extensions"
version = "24.9.21"

[tool.poetry.dependencies]
python = "^3.9"
pywikibot = ">=9.3.0"

[tool.poetry.dev-dependencies]
covdefaults = "2.3.0"
pylint = "3.3.1"
pytest = "8.3.4"
pytest-cov = "6.0.0"
pytest-mock = "3.14.0"
pytest-randomly = "3.16.0"
pytest-socket = "0.7.0"

[tool.pylint]

[tool.pylint.master]
# Use multiple processes to speed up Pylint.
jobs = 0  # default: 1

[tool.pylint.basic]
# Good variable names which should always be accepted
good-names = "e,i,j,k,_"  # default: i,j,k,ex,Run,_

[tool.pylint.format]
max-line-length = 79  # default: 100

[tool.pylint.reports]
reports = "yes"


[tool.pytest]

[tool.pytest.ini_options]
addopts = "--cov --no-cov-on-fail"
